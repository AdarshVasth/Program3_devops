<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive UI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 40px;
            transition: background-color 0.3s;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
        }

        input {
            padding: 12px;
            width: 60%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 15px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #2563eb;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            background: #f1f5f9;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            background-color: #dc2626;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Interactive UI 🚀</h1>
        <p>Change the background color</p>

        <button class="color-btn"
                style="background-color: #fecaca;"
                onclick="changeColor('#fecaca')">
        </button>

        <button class="color-btn"
                style="background-color: #bbf7d0;"
                onclick="changeColor('#bbf7d0')">
        </button>

        <button class="color-btn"
                style="background-color: #bfdbfe;"
                onclick="changeColor('#bfdbfe')">
        </button>

        <button class="color-btn"
                style="background-color: #fde68a;"
                onclick="changeColor('#fde68a')">
        </button>

        <hr>

        <h2>Add Items 📝</h2>

        <input
            type="text"
            id="itemInput"
            placeholder="Enter an item..."
        >

        <button onclick="addItem()">Add Item</button>

        <ul id="itemList"></ul>

    </div>

    <script>
        function changeColor(color) {
            document.body.style.backgroundColor = color;
        }

        function addItem() {
            const input = document.getElementById("itemInput");
            const itemText = input.value.trim();

            if (itemText === "") {
                alert("Please enter an item!");
                return;
            }

            const li = document.createElement("li");
            const span = document.createElement("span");

            span.textContent = itemText;

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";

            deleteButton.onclick = function () {
                li.remove();
            };

            li.appendChild(span);
            li.appendChild(deleteButton);

            document.getElementById("itemList").appendChild(li);

            input.value = "";
            input.focus();
        }

        document.getElementById("itemInput").addEventListener(
            "keydown",
            function (event) {
                if (event.key === "Enter") {
                    addItem();
                }
            }
        );
    </script>

</body>
</html>
